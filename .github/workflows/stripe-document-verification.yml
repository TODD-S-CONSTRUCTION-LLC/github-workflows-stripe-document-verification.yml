# Start a Stripe Identity document verification for one person or job.
#
# Repository secret (not an Actions variable):
#   STRIPE_SECRET_KEY     secret or restricted key from the Stripe Dashboard
#   VERIFICATION_FLOW_ID  optional Dashboard flow id, vf_...
#
# A restricted key (rk_...) must include Identity write permission.
# An invalid key makes Stripe return 401 and this job fails.

name: Document verification

on:
  workflow_dispatch:
    inputs:
      client_reference_id:
        description: 'Reference for this person or job'
        required: true
        type: string
      email:
        description: 'Email to attach to the verification (optional)'
        required: false
        type: string
      return_url:
        description: 'URL to open after the person finishes (optional)'
        required: false
        type: string

jobs:
  create-document-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Create a document verification session
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VERIFICATION_FLOW_ID: ${{ secrets.VERIFICATION_FLOW_ID }}
          CLIENT_REFERENCE_ID: ${{ inputs.client_reference_id }}
          EMAIL: ${{ inputs.email }}
          RETURN_URL: ${{ inputs.return_url }}
        run: |
          set -euo pipefail
          key=$(printf '%s' "${STRIPE_SECRET_KEY:-}" | tr -d '[:space:]')
          if [ -z "$key" ]; then
            echo "STRIPE_SECRET_KEY is missing. Add it under Settings, Secrets and variables, Actions, Repository secrets. An Actions variable will not work."
            exit 1
          fi
          case "$key" in
            sk_*|rk_*) ;;
            *)
              echo "STRIPE_SECRET_KEY must be a Stripe secret key (sk_...) or restricted key (rk_...)."
              exit 1
              ;;
          esac
          args=(
            -sS
            -w "\n%{http_code}"
            "https://api.stripe.com/v1/identity/verification_sessions"
            -u "${key}:"
            --data-urlencode "client_reference_id=${CLIENT_REFERENCE_ID}"
          )
          if [ -n "${VERIFICATION_FLOW_ID:-}" ]; then
            args+=(--data-urlencode "verification_flow=${VERIFICATION_FLOW_ID}")
          else
            args+=(--data-urlencode "type=document")
          fi
          if [ -n "${EMAIL:-}" ]; then
            args+=(--data-urlencode "provided_details[email]=${EMAIL}")
          fi
          if [ -n "${RETURN_URL:-}" ]; then
            args+=(--data-urlencode "return_url=${RETURN_URL}")
          fi
          raw=$(curl "${args[@]}")
          code=$(printf '%s' "$raw" | tail -n 1)
          body=$(printf '%s' "$raw" | sed '$d')
          if [ "$code" != "200" ]; then
            message=$(printf '%s' "$body" | jq -r '.error.message // "Stripe rejected the request."' | sed -E 's/(sk|rk)_(live|test)_[A-Za-z0-9]+/[key]/g')
            echo "Stripe returned HTTP ${code}."
            echo "$message"
            if [ "$code" = "401" ]; then
              echo "This key is not valid. In Stripe, open Developers, API keys, reveal a secret key, and paste that one line into the repository secret STRIPE_SECRET_KEY."
            fi
            exit 1
          fi
          id=$(jq -r '.id' <<<"$body")
          url=$(jq -r '.url' <<<"$body")
          status=$(jq -r '.status' <<<"$body")
          echo "session_id=${id}"
          echo "status=${status}"
          {
            echo "### Document verification"
            echo
            echo "- Session: \`${id}\`"
            echo "- Status: \`${status}\`"
            echo "- Link: ${url}"
          } >> "$GITHUB_STEP_SUMMARY"
